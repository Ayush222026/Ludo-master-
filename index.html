<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1340"><title>Rang Chaal - Offline Ludo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#1b1340;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:500px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
h1{margin:4px 0;font-size:38px;background:linear-gradient(90deg,#ff5252,#ffd740,#4caf50,#42a5f5);-webkit-background-clip:text;background-clip:text;color:transparent}
button{font:inherit;color:#fff;background:#4b36b8;border:3px solid transparent;border-radius:14px;padding:11px 14px;font-weight:700;margin:3px}
button.on{background:#ff9800}button.big{width:100%;font-size:18px;margin:5px 0}
.card{background:#2a1f66;border-radius:16px;padding:12px;width:100%;margin:6px 0}.row{display:flex;flex-wrap:wrap;margin:6px 0}
#menu,#game{width:100%;text-align:center}[hidden]{display:none!important}
canvas{border-radius:14px;box-shadow:0 6px 24px #0008;touch-action:manipulation}
#bar{display:flex;gap:6px;justify-content:center}.pc{border:3px solid;border-radius:12px;padding:3px 7px;font-size:13px;opacity:.55}.pc.on{opacity:1;background:#fff2}
.pc small{display:block;font-size:10px}
#dice{font-size:64px;line-height:1;background:#fff;color:#222;border-radius:18px;width:92px;height:92px;padding:0}
#msg{min-height:24px;font-weight:700}#pk button{width:46px;padding:10px 0}
input{font:inherit;padding:9px;border-radius:10px;border:0;width:150px;margin:3px}
</style></head><body><div id=app>
<div id=menu><h1>Rang Chaal</h1><p>Offline Ludo · Classic &amp; Tricky</p>
<div class=card><b>Mode</b><div class=row id=mm></div><b>Players</b><div class=row id=pc></div><b>Seats (tap to change)</b><div class=row id=seats></div>
<div class=row><button id=pf>👥 Friends</button><button id=pcpu>🤖 vs Computer</button></div></div>
<button id=pfb class=big>👤 Player Profiles</button><div id=prof class=card hidden></div>
<button id=go class=big>▶ Play</button><button id=res class=big>⏪ Resume saved game</button><button id=inf class=big>🎒 Inventory &amp; Stats</button><div id=info class=card hidden></div></div>
<div id=game hidden><div id=bar></div><canvas id=cv></canvas><div id=msg></div>
<button id=dice>⚀</button><div><button id=sp class=s hidden></button></div><div id=pk hidden></div>
<div><button id=mn>☰ Menu</button><button id=sfxb>🔊</button><button id=mub>🎵</button></div></div></div>
<script>
const $=s=>document.querySelector(s),COL=['#e53935','#43a047','#fdd835','#1e88e5'],NM=['Red','Green','Yellow','Blue'],AV=['🦁','🐯','🦊','🐼'],FACE='⚀⚁⚂⚃⚄⚅'.split('');
const P="1,6 2,6 3,6 4,6 5,6 6,5 6,4 6,3 6,2 6,1 6,0 7,0 8,0 8,1 8,2 8,3 8,4 8,5 9,6 10,6 11,6 12,6 13,6 14,6 14,7 14,8 13,8 12,8 11,8 10,8 9,8 8,9 8,10 8,11 8,12 8,13 8,14 7,14 6,14 6,13 6,12 6,11 6,10 6,9 5,8 4,8 3,8 2,8 1,8 0,8 0,7 0,6".split(' ').map(s=>s.split(',').map(Number));
const START=[0,13,26,39],SAFE=new Set([0,8,13,21,26,34,39,47]),TRICK=[3,10,16,23,29,36,42,49],YO=[[0,0],[9,0],[9,9],[0,9]],YS=[[1.7,1.7],[4.3,1.7],[1.7,4.3],[4.3,4.3]];
const HOME=(c,k)=>[[1+k,7],[7,1+k],[13-k,7],[7,13-k]][c],FIN=[[6.6,7.5],[7.5,6.6],[8.4,7.5],[7.5,8.4]];
const ld=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch{return d}};
let INV=ld('lk_inv',{}),ST=ld('lk_st',{p:0,cap:0,dice:0,h:[]}),G=null,busy=false,sfx=true,music=false,AC;
let cfg={mode:'c',n:2,s:['H','medium','medium','medium']};
const AVL=['🦁','🐯','🦊','🐼','🐸','🐵','🦄','🐲','🐧','🦉'];let PR=ld('lk_pr',{});for(const c in PR){NM[c]=PR[c].n;AV[c]=PR[c].a}
const savePR=()=>{PR={};for(let c=0;c<4;c++)PR[c]={n:NM[c],a:AV[c]};localStorage.lk_pr=JSON.stringify(PR)};
function pr(){$('#prof').innerHTML=[0,1,2,3].map(c=>`<div class=row style="align-items:center"><button data-a="${c}" style="border-color:${COL[c]}">${AV[c]}</button><input data-p="${c}" value="${NM[c]}" maxlength=10></div>`).join('')}
$('#pfb').onclick=()=>{$('#prof').hidden=!$('#prof').hidden;pr()};
$('#prof').onclick=e=>{const c=e.target.dataset.a;if(c!=null){AV[c]=AVL[(AVL.indexOf(AV[c])+1)%AVL.length];savePR();pr();mr()}};
$('#prof').oninput=e=>{const c=e.target.dataset.p;if(c!=null){NM[c]=e.target.value.trim()||['Red','Green','Yellow','Blue'][c];savePR();mr()}};
const store=()=>{localStorage.lk_inv=JSON.stringify(INV);localStorage.lk_st=JSON.stringify(ST)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n),ACT=()=>cfg.n==2?[0,2]:cfg.n==3?[0,1,2]:[0,1,2,3];
function beep(f,d=.1,t='sine',v=.08,force){if(!sfx&&!force)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch{}}
const NOTES=[262,330,392,523,392,330,294,370,440,587,440,370];let ni=0;setInterval(()=>{if(music)beep(NOTES[ni++%12],.4,'triangle',.03,1)},450);
function mr(){$('#mm').innerHTML=[['c','Classic'],['t','Tricky']].map(([k,l])=>`<button class="${cfg.mode==k?'on':''}" data-m="${k}">${l}</button>`).join('');
$('#pc').innerHTML=[2,3,4].map(k=>`<button class="${cfg.n==k?'on':''}" data-n="${k}">${k}</button>`).join('');
$('#seats').innerHTML=ACT().map(c=>`<button style="border-color:${COL[c]}" data-s="${c}">${AV[c]} ${NM[c]}: ${cfg.s[c]=='H'?'Human':'CPU '+cfg.s[c]}</button>`).join('');$('#res').hidden=!localStorage.lk_save}
$('#menu').onclick=e=>{const d=e.target.dataset;if(d.m)cfg.mode=d.m;if(d.n)cfg.n=+d.n;if(d.s){const o=['H','easy','medium','hard'];cfg.s[d.s]=o[(o.indexOf(cfg.s[d.s])+1)%4]}mr()};
$('#pf').onclick=()=>{cfg.s=['H','H','H','H'];mr()};$('#pcpu').onclick=()=>{cfg.s=['H','medium','medium','medium'];mr()};
$('#inf').onclick=()=>{$('#info').hidden=false;$('#info').innerHTML=`<b>🎲 Special Dice Inventory (no limit)</b><br>`+[0,1,2,3].map(c=>`${AV[c]} ${NM[c]}: <b>${INV[c]||0}</b>`).join(' · ')+`<br>Total ever collected: ${ST.dice}<hr>Games finished: ${ST.p} · Captures: ${ST.cap}<br>`+ST.h.slice(-8).reverse().join('<br>')};
function show(g){$('#menu').hidden=g;$('#game').hidden=!g;if(g)resize();else mr()}
$('#go').onclick=()=>{G={mode:cfg.mode,turn:0,pl:ACT().map(c=>({c,ai:cfg.s[c]=='H'?0:cfg.s[c],t:[-1,-1,-1,-1],sh:[0,0,0,0],inv:cfg.s[c]=='H'?INV[c]||0:0}))};begin()};
$('#res').onclick=()=>{G=ld('lk_save',null);if(G)begin()};
function begin(){show(true);music=true;turn()}
$('#mn').onclick=()=>{busy=true;show(false)};
$('#sfxb').onclick=e=>{sfx=!sfx;e.target.textContent=sfx?'🔊':'🔇'};$('#mub').onclick=e=>{music=!music;e.target.style.opacity=music?1:.4};
const lv=p=>({easy:1,medium:2,hard:3})[p.ai],cur=()=>G.pl[G.turn],msg=t=>$('#msg').textContent=t;
const legal=(p,r)=>[0,1,2,3].filter(i=>p.t[i]<0?r==6:p.t[i]+r<=56);
function gain(p,n){p.inv+=n;if(!p.ai){INV[p.c]=p.inv;ST.dice+=n;store()}}
function use(p){p.inv--;if(!p.ai){INV[p.c]=p.inv;store()}}
const abs=(p,q)=>(START[p.c]+q)%52;
function danger(p,a){let n=0;for(const o of G.pl)if(o!==p)for(const q of o.t)if(q>=0&&q<=50){const d=(a-abs(o,q)+52)%52;if(d>=1&&d<=6)n++}return n}
function score(p,i,r){const t=p.t[i],to=t<0?0:t+r,l=lv(p);let s=Math.random()*5+to*.3;if(to==56)s+=80;if(t<0)s+=45;
if(to<=50){const a=abs(p,to);if(!SAFE.has(a)){for(const o of G.pl)if(o!==p)for(const q of o.t)if(q>=0&&q<=50&&abs(o,q)==a)s+=100;if(l>2)s-=danger(p,a)*18}else if(l>2)s+=25;
if(l>2&&t>=0&&t<=50&&!SAFE.has(abs(p,t)))s+=danger(p,abs(p,t))*22}else s+=20;return s}
function pick(p,r,m){if(lv(p)==1)return m[rnd(m.length)];return m.reduce((b,i)=>score(p,i,r)>score(p,b,r)?i:b,m[0])}
async function turn(){if(G.over)return;const p=cur();G.ph='roll';localStorage.lk_save=JSON.stringify(G);busy=false;ui();msg(`${AV[p.c]} ${NM[p.c]}'s turn`);
if(p.ai){busy=true;ui();await sleep(800);if(lv(p)>1&&p.inv>0){let b=[0,0];for(let n=1;n<7;n++)for(const i of legal(p,n)){const s=score(p,i,n);if(s>b[0])b=[s,n]}if(b[0]>=(lv(p)>2?80:100)){use(p);return roll(b[1])}}roll()}}
function ui(){const p=cur();$('#bar').innerHTML=G.pl.map((q,i)=>`<div class="pc${i==G.turn?' on':''}" style="border-color:${COL[q.c]}">${AV[q.c]}<small>${NM[q.c]}${q.ai?' 🤖':''}</small>🏠${q.t.filter(x=>x==56).length} 🎲${q.inv}</div>`).join('');
$('#sp').hidden=!(!p.ai&&p.inv>0&&G.ph=='roll'&&!busy);$('#sp').textContent=`🎲 Use special dice ×${p.inv}`;$('#pk').hidden=true}
$('#dice').onclick=()=>{if(!busy&&!cur().ai&&G.ph=='roll')roll()};
$('#sp').onclick=()=>{$('#pk').hidden=!$('#pk').hidden};
$('#pk').innerHTML=[1,2,3,4,5,6].map(n=>`<button data-n="${n}">${n}</button>`).join('');
$('#pk').onclick=e=>{const n=+e.target.dataset.n;if(n&&!busy&&G.ph=='roll'&&cur().inv>0){use(cur());roll(n)}};
async function roll(f){busy=true;const p=cur();ui();for(let k=0;k<8;k++){$('#dice').textContent=FACE[rnd(6)];beep(200+k*40,.05);await sleep(70)}
const r=f||rnd(6)+1;G.roll=r;if(r==6){G.six=(G.six||0)+1;if(G.six>=3){G.six=0;$('#dice').textContent=FACE[5];msg('🚫 Three 6s in a row! Turn lost');await sleep(1200);return nxt()}}else G.six=0;$('#dice').textContent=FACE[r-1];const m=legal(p,r);
if(!m.length){msg(`Rolled ${r} - no move`);await sleep(800);return nxt()}
if(p.ai||m.length==1){await sleep(300);return move(p,p.ai?pick(p,r,m):m[0],r)}
G.ph='pick';busy=false;msg(`Rolled ${r} - tap a glowing token`)}
function nxt(){G.six=0;G.turn=(G.turn+1)%G.pl.length;turn()}
async function move(p,i,r){busy=true;G.ph='x';const t=p.t,from=t[i],to=from<0?0:from+r;let ex=r==6,cap=0;
if(from<0){t[i]=0;beep(500)}else for(let k=from+1;k<=to;k++){t[i]=k;beep(300+k*5,.05);await sleep(130)}
if(to<=50){const a=abs(p,to);
if(!SAFE.has(a))for(const o of G.pl)if(o!==p)o.t.forEach((q,j)=>{if(q>=0&&q<=50&&abs(o,q)==a){if(o.sh&&o.sh[j]){o.sh[j]=0;msg('🛡️ Shield saved a token!')}else{o.t[j]=-1;cap++}}});
if(G.mode=='t'&&TRICK.includes(a)){const e=rnd(5);await sleep(300);beep(700,.3,'square');
if(e==0){gain(p,2);msg('🎁 Gift tile! +2 special dice')}
else if(e==1&&to+4<=50){t[i]=to+4;msg('⚡ Boost! +4 steps')}
else if(e==2&&to>=3){t[i]=to-3;msg('🕳️ Trap! back 3 steps')}
else if(e==3){ex=true;msg('🔁 Bonus move!')}else if(e==4){(p.sh=p.sh||[0,0,0,0])[i]=1;msg('🛡️ Shield! Safe from the next capture')}else msg('✨ Surprise tile - nothing happened')}}
if(cap){ex=true;ST.cap+=cap;gain(p,cap);beep(120,.4,'sawtooth');msg(`💥 Captured ${cap}! +${cap} special dice`)}
if(to==56){ex=true;gain(p,1);beep(900,.3);msg('🏠 Token home! +1 special dice')}
ui();await sleep(600);
if(t.every(q=>q==56)){G.over=true;delete localStorage.lk_save;ST.p++;ST.h.push(`${new Date().toLocaleDateString()} · ${G.mode=='t'?'Tricky':'Classic'} · ${AV[p.c]} ${NM[p.c]} won`);store();msg(`🏆 ${NM[p.c]} wins! Open Menu for a new game`);[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.3),k*200));return}
ex?turn():nxt()}
function xy(p,i){const q=p.t[i];if(q<0){const[a,b]=YS[i],[ox,oy]=YO[p.c];return[ox+a,oy+b]}
if(q<=50){const c=P[abs(p,q)];return[c[0]+.5+(i-1.5)*.06,c[1]+.5+(i-1.5)*.06]}
if(q<=55){const c=HOME(p.c,q-51);return[c[0]+.5,c[1]+.5]}return[FIN[p.c][0]+(i-1.5)*.1,FIN[p.c][1]+(i-1.5)*.1]}
const cv=$('#cv'),X=cv.getContext('2d');
function resize(){const w=Math.min(innerWidth-20,480),d=devicePixelRatio||1;cv.style.width=cv.style.height=w+'px';cv.width=cv.height=Math.round(w*d)}
addEventListener('resize',()=>{if(!$('#game').hidden)resize()});
cv.onclick=e=>{if(!G||busy||G.ph!='pick')return;const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*15,y=(e.clientY-b.top)/b.height*15,p=cur();
for(const i of legal(p,G.roll)){const[a,c]=xy(p,i);if(Math.hypot(a-x,c-y)<.8){return move(p,i,G.roll)}}};
function draw(){const s=cv.width/15;if(!G||$('#game').hidden)return;X.fillStyle='#fff8e1';X.fillRect(0,0,cv.width,cv.width);
for(let c=0;c<4;c++){const[ox,oy]=YO[c];X.fillStyle=COL[c];X.fillRect(ox*s,oy*s,6*s,6*s);X.fillStyle='#fff8e1';X.fillRect((ox+1)*s,(oy+1)*s,4*s,4*s);
if(G.pl.some(q=>q.c==c))YS.forEach(([a,b])=>{X.fillStyle=COL[c]+'55';X.beginPath();X.arc((ox+a)*s,(oy+b)*s,.55*s,0,7);X.fill()})}
X.font=`${s*.6}px sans-serif`;X.textAlign='center';X.textBaseline='middle';
P.forEach(([a,b],i)=>{X.fillStyle='#fff';X.fillRect(a*s,b*s,s,s);const c=START.indexOf(i);if(c>=0){X.fillStyle=COL[c];X.fillRect(a*s,b*s,s,s)}
X.strokeStyle='#8886';X.strokeRect(a*s,b*s,s,s);if(SAFE.has(i)){X.fillStyle=c>=0?'#fff':'#999';X.fillText('★',(a+.5)*s,(b+.55)*s)}
else if(G.mode=='t'&&TRICK.includes(i)){X.fillStyle='#8e24aa';X.fillText('?',(a+.5)*s,(b+.55)*s)}});
for(let c=0;c<4;c++)for(let k=0;k<5;k++){const[a,b]=HOME(c,k);X.fillStyle=COL[c];X.fillRect(a*s,b*s,s,s);X.strokeStyle='#fff6';X.strokeRect(a*s,b*s,s,s)}
[[[6,6],[6,9]],[[6,6],[9,6]],[[9,6],[9,9]],[[6,9],[9,9]]].forEach(([u,v],c)=>{X.fillStyle=COL[c];X.beginPath();X.moveTo(u[0]*s,u[1]*s);X.lineTo(v[0]*s,v[1]*s);X.lineTo(7.5*s,7.5*s);X.fill()});
const mv=G.ph=='pick'?legal(cur(),G.roll):[],pulse=.5+.5*Math.sin(Date.now()/150);
G.pl.forEach(p=>p.t.forEach((q,i)=>{const[a,b]=xy(p,i);X.fillStyle='#0004';X.beginPath();X.arc(a*s,(b+.08)*s,.34*s,0,7);X.fill();
X.fillStyle=COL[p.c];X.strokeStyle='#fff';X.lineWidth=s*.07;X.beginPath();X.arc(a*s,b*s,.33*s,0,7);X.fill();X.stroke();
X.fillStyle='#fff7';X.beginPath();X.arc((a-.1)*s,(b-.1)*s,.1*s,0,7);X.fill();
if(p.sh&&p.sh[i]){X.strokeStyle='#80d8ff';X.lineWidth=s*.08;X.beginPath();X.arc(a*s,b*s,.42*s,0,7);X.stroke()}
if(p===cur()&&mv.includes(i)){X.strokeStyle=`rgba(255,255,255,${.4+pulse*.6})`;X.lineWidth=s*.1;X.beginPath();X.arc(a*s,b*s,(.45+pulse*.1)*s,0,7);X.stroke()}}))}
(function loop(){draw();requestAnimationFrame(loop)})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
mr();
</script></body></html>
