<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1340"><title>Rang Chaal - Offline Ludo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#1b1340;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:500px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
h1{margin:4px 0;font-size:38px;background:linear-gradient(90deg,#ff5252,#ffd740,#4caf50,#42a5f5);-webkit-background-clip:text;background-clip:text;color:transparent}
button{font:inherit;color:#fff;background:#4b36b8;border:3px solid transparent;border-radius:14px;padding:11px 14px;font-weight:700;margin:3px}
button.on{background:#ff9800}button.big{width:100%;font-size:18px;margin:5px 0}
.card{background:#2a1f66;border-radius:16px;padding:12px;width:100%;margin:6px 0}.row{display:flex;flex-wrap:wrap;margin:6px 0}
#menu,#game{width:100%;text-align:center}[hidden]{display:none!important}
canvas{border-radius:14px;box-shadow:0 6px 24px #0008;touch-action:manipulation}
#bar{display:flex;gap:6px;justify-content:center}.pc{border:3px solid;border-radius:12px;padding:3px 7px;font-size:13px;opacity:.55}.pc.on{opacity:1;background:#fff2}
.pc small{display:block;font-size:10px}
#dice{font-size:64px;line-height:1;background:#fff;color:#222;border-radius:18px;width:92px;height:92px;padding:0}
#msg{min-height:24px;font-weight:700}#pk button{width:46px;padding:10px 0}
input{font:inherit;padding:9px;border-radius:10px;border:0;width:150px;margin:3px}
body{background:radial-gradient(circle at 20% 0%,#4b2fbf,#1b1340 55%,#0e0a26);background-attachment:fixed}
#menu{position:relative;overflow:hidden;padding-bottom:20px}#menu>*:not(.fl){position:relative;z-index:1}
.fl{position:absolute;top:0;font-size:30px;opacity:.22;animation:fl 10s linear infinite;pointer-events:none}
@keyframes fl{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
.logo{font-size:84px;line-height:1.1;animation:sp 4s ease-in-out infinite;filter:drop-shadow(0 8px 12px #0008)}
@keyframes sp{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.12)}}
h1{font-size:46px;letter-spacing:2px;margin:0;filter:drop-shadow(0 0 12px #ffd74088)}
.tag{opacity:.85;margin:2px 0 8px;font-size:15px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:12px}.dots i{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px #0007}
.card{background:#ffffff14;backdrop-filter:blur(8px);border:1px solid #ffffff22}
button{box-shadow:0 4px 0 #0006}button:active{transform:translateY(3px);box-shadow:none}
#go{background:linear-gradient(#4cd964,#1faa3b);font-size:22px;padding:15px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.04)}}
#res,#inf,#pfb{background:linear-gradient(#6b4de0,#432fa8)}
body{background:repeating-linear-gradient(45deg,#ffffff0a 0 28px,#0000 28px 56px),radial-gradient(circle at 50% 0,#2f6bff,#16339a 55%,#0a1a58);background-attachment:fixed}
.top{display:flex;align-items:center;gap:8px;background:#0b1f6b;border-bottom:3px solid #f5b81c;border-radius:0 0 16px 16px;padding:8px 10px;margin:-10px -10px 6px;width:calc(100% + 20px)}
.av{width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid #f5b81c;font-size:26px;display:flex;align-items:center;justify-content:center}
.pill{background:#071447;border-radius:14px;padding:5px 14px;font-weight:800;border:2px solid #f5b81c}
.lg{margin:6px 0 10px}.crown{font-size:42px;line-height:1;filter:drop-shadow(0 3px 4px #0008)}
.lt{display:inline-flex;width:56px;height:56px;border-radius:50%;background:#fff;border:5px solid;align-items:center;justify-content:center;font-size:32px;font-weight:900;margin:2px;box-shadow:0 4px 0 #0006}
.sub{font-size:44px;font-weight:900;letter-spacing:6px;color:#ffd54a;-webkit-text-stroke:2px #5a3500;text-shadow:0 4px 0 #5a3500}
.seg{display:flex;background:#071447;border-radius:30px;padding:4px;margin:8px 0}.seg button{flex:1;margin:0;background:none;box-shadow:none;border-radius:26px}
.seg button.on{background:linear-gradient(#ffd54a,#f5a300);color:#3b2400}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.tile{width:calc(50% - 10px);height:135px;background:linear-gradient(#2e6bd9 62%,#f5b81c 62%);border:3px solid #f5b81c;border-radius:16px;padding:0;margin:0;position:relative;overflow:hidden;box-shadow:0 5px 0 #8a5a00}
.tile .e{font-size:50px;display:block;margin-top:12px}.tile .l{position:absolute;bottom:5px;left:0;right:0;font-size:18px;letter-spacing:1px;-webkit-text-stroke:1px #4a2d00;text-shadow:0 2px 0 #4a2d00}
.g3 .tile{width:calc(33.3% - 8px);height:115px}.g3 .e{font-size:24px;margin-top:22px}.g3 .l{font-size:14px}
.tile.sel{outline:4px solid #fff}
.gold{background:linear-gradient(#ffd54a,#f5a300);color:#3b2400;font-size:22px;padding:14px;border-color:#fff4;box-shadow:0 5px 0 #8a5a00}
.back{background:none;box-shadow:none;opacity:.8}h2{margin:10px 0}
.nav{display:flex;margin:18px -10px 0;width:calc(100% + 20px);background:#0b1f6b;border-top:3px solid #f5b81c}.nav button{flex:1;margin:0;border-radius:0;background:none;box-shadow:none}
canvas{box-shadow:0 0 0 5px #f5b81c,0 10px 26px #000a}
#dice{background:radial-gradient(circle at 30% 25%,#fff,#d6d6d6);box-shadow:0 6px 0 #999,0 12px 16px #0007}#dice:active{transform:translateY(4px)}
@keyframes shake{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) scale(1.12)}}#dice.rl{animation:shake .25s infinite}
#win{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;overflow:hidden}
#win .card{max-width:340px;text-align:center;border:3px solid #f5b81c;background:#1a2f8a}.trophy{font-size:80px;animation:sp 2s ease-in-out infinite}
</style></head><body><div id=app>
<div id=menu><div class=top><div class=av id=tav>🦁</div><b id=tnm>Red</b><span style="flex:1"></span><span class=pill id=tmode>🎲 Classic</span></div>
<div class=lg><div class=crown>👑</div><div><span class=lt style="color:#e53935;border-color:#e53935">R</span><span class=lt style="color:#43a047;border-color:#43a047">A</span><span class=lt style="color:#fbc02d;border-color:#fbc02d">N</span><span class=lt style="color:#1e88e5;border-color:#1e88e5">G</span></div><div class=sub>CHAAL</div></div>
<div id=stage><div style="padding:20px">⏳ Loading... (agar yeh dikhta rahe to game code chala nahi)</div></div></div>
<div id=win hidden><span class=fl style="left:10%">🎉</span><span class=fl style="left:35%;animation-delay:-4s">⭐</span><span class=fl style="left:60%;animation-delay:-2s">🎊</span><span class=fl style="left:85%;animation-delay:-6s">⭐</span>
<div class=card><div class=trophy>🏆</div><h2 id=wn></h2><p id=ws></p><button id=wagain class="gold big">🔁 Play again</button><button id=whome class="back big">🏠 Menu</button></div></div>
<div id=game hidden><div id=bar></div><canvas id=cv></canvas><div id=msg></div>
<button id=dice>⚀</button><div><button id=sp class=s hidden></button><button id=bl class=s hidden></button></div><div id=pk hidden></div>
<div><button id=mn>☰ Menu</button><button id=sfxb>🔊</button><button id=mub>🎵</button></div></div></div>
<script>onerror=function(m,u,l){var d=document.getElementById('stage');if(d)d.innerHTML='<div style="padding:12px;background:#5a0000;border-radius:12px;font-size:14px;text-align:left;word-break:break-all">⚠️ Error: '+m+' (line '+l+')<br>Send me a screenshot of this.</div>'}</script>
<script src="game.js?v=7" onerror="document.getElementById('stage').innerHTML='<div style=&quot;padding:14px;background:#5a0000;border-radius:12px&quot;>⚠️ game.js file nahi mili. GitHub par game.js bhi upload karo.</div>'"></script>
<script>setTimeout(function(){if(!window.__ok){var d=document.getElementById('stage');if(d&&d.innerHTML.indexOf('Loading')>=0)d.innerHTML='<div style="padding:14px;background:#5a0000;border-radius:12px">⚠️ game.js adhura ya purana hai. Naya game.js dobara upload karo.</div>'}},2500)</script></body></html>
